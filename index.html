<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- HEADER / TITLE SECTION -->
    <header class="title-page" id="home">
        <div class="title-page-content">
            <h1>Jemuel</h1>
            <div class="jemuel-arts">Arts & Portfolio</div>
        </div>
    </header>

    <!-- ABOUT ME -->
    <section class="about" id="about">
        <h3>About Me</h3>
        <p>
            Welcome to my portfolio! I create digital and traditional art,
            exploring color, expression, and storytelling.
        </p>
    </section>

    <!-- CONTACTS (now below About Me) -->
    <section class="contact" id="contact">
        <div class="header-contacts">
            <a href="https://facebook.com" target="_blank">Facebook</a>
            <a href="mailto:jemuel@email.com">Email</a>
            <a href="https://instagram.com" target="_blank">Instagram</a>
        </div>
    </section>

    <!-- GALLERY -->
    <section id="gallery">
        <div class="carousel-container">
            <div class="carousel-viewport">
                <div class="carousel-track">
                    <div class="carousel-panel"><img src="images/artwork0.png"></div>
                    <div class="carousel-panel"><img src="images/artwork1.png"></div>
                    <div class="carousel-panel"><img src="images/artwork2.png"></div>
                    <div class="carousel-panel"><img src="images/artwork3.png"></div>
                    <div class="carousel-panel"><img src="images/artwork4.png"></div>
                    <div class="carousel-panel"><img src="images/artwork5.png"></div>
                    <div class="carousel-panel"><img src="images/artwork6.png"></div>
                    <div class="carousel-panel"><img src="images/artwork7.png"></div>
                </div>
            </div>

            <div class="carousel-buttons">
                <button class="carousel-btn" id="prev">‹</button>
                <button class="carousel-btn" id="next">›</button>
            </div>
        </div>
    </section>

</body>
</html>
